<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ForCoTech Schallhauben PV-Wechselrichter</title>
<style>
:root{
  --accent:#0f7c80; --accent-d:#0a5b5e; --accent-l:#e3f2f2;
  --red:#c8202f; --blue:#2563c9; --ink:#13232b; --muted:#5d6f78; --line:#d9e2e5;
  --bg:#f5f7f7; --card:#ffffff; --warn-l:#fff4e2; --ok:#1d7a3e;
  --r:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#smc{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--accent);padding-bottom:12px;margin-bottom:20px}
.hdr h1{margin:0;font-size:26px;letter-spacing:-.01em;text-wrap:balance}
.hdr p{margin:4px 0 0;color:var(--muted);max-width:64ch}
.logolink{display:block;border-radius:6px}
.logolink:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.logo{height:130px;width:auto;display:block}
@media (max-width:520px){.logo{height:auto;width:100%;max-width:300px}}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13px;font-weight:700}
.nav a{color:var(--accent);text-decoration:none;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
.nav a[aria-current]{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav .sep{width:10px}
.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:16px;margin:0 0 16px;align-items:start}
@media (max-width:900px){.top2{grid-template-columns:1fr}}
.intro{display:grid;grid-template-columns:1fr;gap:10px}
.intro div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
.intro b{display:block;font-size:13.5px;margin-bottom:2px}
.fig{margin:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px}
.fig img,.fig svg{display:block;width:100%;height:auto;max-height:340px;object-fit:contain}
.fig figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:focus-visible,.seg button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,.rot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{flex:1 1 220px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.seg{display:inline-flex;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink);white-space:nowrap}
@media (max-width:520px){.seg{display:flex;width:100%}.seg button{flex:1;white-space:normal;padding:7px 8px}}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mf{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card h3{margin:2px 0 0;font-size:16px}
.code{font:600 11.5px ui-monospace,Menlo,Consolas,monospace;color:var(--accent-d);background:var(--accent-l);border-radius:5px;padding:2px 6px;white-space:nowrap}
.models{display:flex;flex-wrap:wrap;gap:4px}
.models span{font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.models span.hit{background:#fff4c2;border-color:#e6cf6a}
.spec{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:0}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
.v3d{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;border-radius:8px;background:linear-gradient(#fbfdfd,#f1f5f5)}
.v3d:active{cursor:grabbing}
.v3d svg{display:block;width:100%;height:200px}
.v3d.big svg{height:380px}
@media (max-width:520px){.v3d.big svg{height:290px}}
.rot{position:absolute;right:6px;top:6px;border:1px solid var(--line);background:#fff;border-radius:6px;font:inherit;font-size:12px;padding:2px 7px;cursor:pointer;color:var(--accent-d)}
.hint{font-size:11.5px;color:var(--muted);text-align:center;margin:-4px 0 0}
.buy{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.price{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.price small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctrl select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:13px;background:#fff}
.btn{border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.btn:hover{background:var(--accent-d)}
.btn.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{padding:6px 10px;font-size:13px}
.ok{color:var(--ok);font-size:12.5px;font-weight:600}
.warnt{color:#a15c00;font-size:12.5px;font-weight:600}
.micro{background:var(--warn-l);border:1px solid #f0d3a3;border-radius:8px;padding:10px 12px;font-size:13px}
.side{position:sticky;top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
@media (max-width:960px){.side{position:static}}
.side h2{margin:0 0 10px;font-size:16px}
.empty{color:var(--muted);font-size:13.5px;margin:0}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.line .q{display:flex;gap:6px;align-items:center}
.line input{width:56px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font:inherit}
.line button{border:0;background:none;color:var(--red);cursor:pointer;font:inherit;font-size:12.5px;padding:0}
.line .lp{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.line .ld{grid-column:1/-1;color:var(--muted);font-size:12px}
.sum{display:flex;justify-content:space-between;font-weight:800;font-size:16px;margin:10px 0 2px}
.note{font-size:11.5px;color:var(--muted);margin:6px 0 0}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:8px}
label.f input,label.f textarea,label.f select{display:block;width:100%;margin-top:3px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font:inherit;color:var(--ink);background:#fff}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;margin:10px 0 6px;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--accent)}
.privacy{margin-top:10px;border:1px solid var(--line);border-radius:8px;background:#fafcfc;font-size:12px;color:var(--muted)}
.privacy summary{cursor:pointer;padding:8px 10px;font-weight:600;color:var(--ink)}
.privacy div{padding:0 10px 4px}
.privacy p{margin:0 0 6px}
.privacy a,.chk a{color:var(--accent)}
.err{color:var(--red);font-size:13px;margin-top:6px}
.thanks{padding:14px;border-radius:8px;background:var(--accent-l);border:1px solid #bfdede;font-size:14px}
.readybox{margin-top:10px;padding:12px;border-radius:8px;background:var(--warn-l);border:1px solid #f0d3a3;font-size:13px}
.readybox textarea{width:100%;margin-top:8px;font:12px ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:6px;padding:8px}
.count{font-size:13px;color:var(--muted)}
.cfglink{color:var(--accent);font-weight:700}
.sonder{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;scroll-margin-top:12px}
.sonder h2{margin:0 0 4px;font-size:19px}
.sonder>p{margin:0 0 12px;color:var(--muted);font-size:13.5px;max-width:80ch}
.sgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.sgrid{grid-template-columns:1fr}}
.fset{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fset .w2{grid-column:1/-1}
.fset h4{grid-column:1/-1;margin:14px 0 0;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-d)}
.sres .spec{font-size:13.5px;margin-top:10px}
.sres .buy{margin-top:12px}
.copy{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
[hidden]{display:none!important}
/* 3D-Skizze */
svg .wl{fill:#9aa9af;fill-opacity:.22;stroke:#9aa9af;stroke-width:1}
svg .gd{fill:#9aa9af;fill-opacity:.16;stroke:none}
svg .fr{fill:#0f7c80;fill-opacity:.10;stroke:#0a5b5e;stroke-width:1.3;stroke-linejoin:round;vector-effect:non-scaling-stroke}
svg .inv{fill:#13232b;fill-opacity:.55;stroke:#13232b;stroke-width:1;vector-effect:non-scaling-stroke}
svg .sh{fill:#5d6f78;fill-opacity:.85;stroke:none}
svg .sil{fill:#13232b;fill-opacity:.05;stroke:#13232b;stroke-opacity:.45;stroke-width:1;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
svg .in{fill:#2563c9;fill-opacity:.18;stroke:#2563c9;stroke-opacity:.6;stroke-width:1;vector-effect:non-scaling-stroke}
svg .tb{fill:#fff;stroke:#13232b;stroke-opacity:.55;stroke-width:.8;vector-effect:non-scaling-stroke}
svg .dr{stroke:#0a5b5e;stroke-width:1.2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
svg .ai{stroke:#2563c9;fill:#2563c9;stroke-width:2;vector-effect:non-scaling-stroke}
svg .ao{stroke:#c8202f;fill:#c8202f;stroke-width:2;vector-effect:non-scaling-stroke}
svg .dm{font-weight:650;font-family:system-ui,sans-serif;fill:#13232b;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
</style>
</head>
